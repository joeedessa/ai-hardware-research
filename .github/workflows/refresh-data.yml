name: Refresh market data

# Four passes a day, timed to the three regional sessions this universe spans —
# a single evening run missed every Asian and European release by ~15 hours.
# Cron is UTC and does not observe DST, so each slot carries ~1h of buffer.
on:
  schedule:
    - cron: '45 6 * * 1-5'    # Asia post-close  — Tokyo/Seoul 15:30 local, Taipei 13:30
    - cron: '45 12 * * 1-5'   # US pre-open      — BMO releases land ~12:30 UTC; Europe mid-session
    - cron: '0 16 * * 1-5'    # Europe post-close— Frankfurt/Paris 17:30 local; US mid-session
    - cron: '30 21 * * 1-5'   # US post-close    — AMC releases + the full end-of-day rebuild
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = everything; light = prices, signals and earnings only'
        default: full
        type: choice
        options: [full, light]

permissions:
  contents: write

# The three intraday passes run light: prices, signals and anything reporting now.
# The evening pass rebuilds everything including the slow per-ticker and RSS work.
env:
  FETCH_MODE: >-
    ${{ github.event_name == 'schedule'
        && (github.event.schedule == '30 21 * * 1-5' && 'full' || 'light')
        || inputs.mode || 'full' }}

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet yfinance feedparser lxml
      - name: Fetch market data (${{ env.FETCH_MODE }})
        run: python scripts/fetch_market.py
      - name: Validate data files
        run: |
          python - <<'EOF'
          import json, glob
          for f in glob.glob('data/*.json'):
              json.load(open(f))
          print('all data/*.json valid')
          EOF
      - name: Commit if changed
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@github.com"
          git add data/quotes.json data/indices.json data/news.json data/alerts.json data/performance.json data/breaking.json data/calendar.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Market data refresh (${FETCH_MODE})"
          git pull --rebase origin main
          git push
