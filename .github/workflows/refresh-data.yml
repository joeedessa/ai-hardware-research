name: Refresh market data

on:
  schedule:
    # Weekdays 21:30 UTC — after the US close; Asia closes are from earlier the same day
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install --quiet yfinance feedparser
      - name: Fetch market data
        run: python scripts/fetch_market.py
      - name: Validate data files
        run: |
          python - <<'EOF'
          import json, glob
          for f in glob.glob('data/*.json'):
              json.load(open(f))
          print('all data/*.json valid')
          EOF
      - name: Commit if changed
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@github.com"
          git add data/quotes.json data/indices.json data/news.json data/alerts.json data/performance.json data/breaking.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Nightly market data refresh"
          git pull --rebase origin main
          git push
